# Qalqon dashboard — reverse proxy, origin behind Cloudflare.
#
# A NEW site file. It does not modify k-apply or visa.k-apply.uz in any way:
# nginx matches on server_name, and this name is distinct, so the existing
# sites are unaffected whether this block is present or not.
#
# Cloudflare is the only intended path in (proxied / orange cloud, SSL mode
# Full (strict)). It terminates TLS for the visitor and opens a second TLS
# connection to this origin, which presents a Cloudflare Origin CA certificate.
# There is no certbot here — an Origin CA cert is issued by Cloudflare, is
# valid for years, and does not need a public HTTP-01 challenge.
#
# Setup, IP allow-listing and the Cloudflare-side settings: see CLOUDFLARE.md.

# Real client IPs from CF-Connecting-IP. Installed to /etc/nginx/conf.d/ so it
# loads once for the whole server; see CLOUDFLARE.md step 5.
# (deploy/cloudflare-real-ip.conf)

server {
    listen 80;
    listen [::]:80;
    server_name qalqon-safe.uz;

    # Cloudflare is configured to talk to the origin over 443 only. Anything
    # arriving here came direct, bypassing the proxy — send it back over TLS
    # rather than serving a byte of the dashboard in clear text.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # This must also be the domain registered with /setdomain in @BotFather;
    # Telegram's login widget checks the page's host against it.
    server_name qalqon-safe.uz;

    # Cloudflare Origin CA certificate — trusted by Cloudflare, NOT by browsers.
    # That is fine and expected: no browser ever connects here directly. A
    # direct visit shows a certificate warning, which is a feature.
    ssl_certificate     /etc/ssl/cloudflare/qalqon-safe.uz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/qalqon-safe.uz.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls: refuse any TLS connection that does not
    # present Cloudflare's client certificate, so the origin cannot be reached
    # by anyone who discovers its IP. Turn this on only AFTER the site works
    # end to end — a missing CA file locks you out with a 400. CLOUDFLARE.md
    # step 8 has the download and the toggle.
    #ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    #ssl_verify_client on;

    # The dashboard renders private group messages. Keep it out of search
    # engines even though it requires a login.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        # The panel listens on loopback only; nginx is the sole way in.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # $remote_addr is the real visitor, not a Cloudflare edge node, because
        # of the real_ip directives in cloudflare-real-ip.conf. Setting
        # X-Forwarded-For to it — rather than appending with
        # $proxy_add_x_forwarded_for — drops the edge hop and the visitor's own
        # unverifiable header, leaving uvicorn exactly one address to trust.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Without this the app believes requests arrived over plain HTTP and
        # will not set the Secure flag on the session cookie.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Small, static page; nothing to gain from large uploads.
    client_max_body_size 1m;

    access_log /var/log/nginx/qalqon.access.log;
    error_log  /var/log/nginx/qalqon.error.log;
}

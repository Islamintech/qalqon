# Qalqon dashboard — reverse proxy.
#
# A NEW site file. It does not modify k-apply or visa.k-apply.uz in any way:
# nginx matches on server_name, and this name is distinct, so the existing
# sites are unaffected whether this block is present or not.
#
# certbot --nginx rewrites this file to add the TLS listener and the 80->443
# redirect. Run it AFTER this is enabled and `nginx -t` passes.

server {
    listen 80;
    listen [::]:80;

    # nip.io is wildcard DNS: <anything>.<ip>.nip.io resolves to that IP. It
    # gives us a real hostname — which Let's Encrypt can certify and Telegram's
    # login widget will accept — without buying a domain.
    server_name 76.13.222.177.nip.io;

    # The dashboard renders private group messages. Keep it out of search
    # engines even though it requires a login.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        # The panel listens on loopback only; nginx is the sole way in.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app believes requests arrived over plain HTTP and
        # will not set the Secure flag on the session cookie.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Small, static page; nothing to gain from large uploads.
    client_max_body_size 1m;

    access_log /var/log/nginx/qalqon.access.log;
    error_log  /var/log/nginx/qalqon.error.log;
}

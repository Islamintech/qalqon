# Qalqon — isolated from everything else on this host.
#
# No published ports: the bot polls Telegram outbound and listens on nothing,
# so it cannot collide with other services on the box. Nothing here touches
# any other project's containers, networks, volumes or nginx configuration.

services:
  bot:
    build: .
    image: qalqon:latest
    container_name: qalqon-bot
    restart: unless-stopped
    # Run as the host user that owns ./data. A bind mount keeps the HOST's
    # ownership, so a container user the host does not know cannot write to it.
    # Matching uids also keeps the database readable for backups from the host
    # — which a root-owned or docker-volume-owned file would not be.
    # Override with PUID/PGID if the deploying user is not uid 1000.
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      # Overrides whatever .env says: inside the container the database must
      # live on the mounted volume, or a rebuild would erase every record.
      DB_PATH: /data/qalqon.db
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        # Cap the logs. This box hosts other production services; an unbounded
        # log from a chatty bot must never be what fills the disk.
        max-size: "10m"
        max-file: "3"

  # Read-only dashboard. Optional: `docker compose up -d web` to start it.
  web:
    build: .
    image: qalqon:latest
    container_name: qalqon-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      DB_PATH: /data/qalqon.db
    volumes:
      # Read-only mount as well as a read-only SQLite connection. Two
      # independent guarantees that the panel cannot alter moderation state.
      - ./data:/data:ro
    # 127.0.0.1 ONLY. Reached over an SSH tunnel:
    #   ssh -L 8080:127.0.0.1:8080 <user>@<host>
    # Binding to 0.0.0.0 would publish private group messages over plain HTTP.
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      uvicorn web.app:app --host 0.0.0.0 --port 8080
      --proxy-headers --forwarded-allow-ips=*
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
